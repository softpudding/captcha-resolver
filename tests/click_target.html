<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Click Target Test</title>
<style>
  html,body{height:100%;margin:0;font-family:-apple-system,Helvetica,Arial,sans-serif;}
  #stage{height:100%;display:flex;align-items:center;justify-content:center;
         background:#f2f2f2;transition:background .2s;}
  #btn{font-size:40px;padding:50px 90px;border:none;border-radius:16px;
       background:#1a73e8;color:#fff;cursor:pointer;box-shadow:0 6px 18px rgba(0,0,0,.25);}
  #stage.done{background:#0b8043;}
  #msg{display:none;font-size:90px;color:#fff;font-weight:700;}
  #stage.done #btn{display:none;}
  #stage.done #msg{display:block;}
</style>
</head>
<body>
  <div id="stage">
    <button id="btn">CLICK ME</button>
    <div id="msg">SUCCESS</div>
  </div>
<script>
  document.getElementById('btn').addEventListener('click', () => {
    document.getElementById('stage').classList.add('done');
    document.title = 'CLICKED-OK';
  });
</script>
</body>
</html>
